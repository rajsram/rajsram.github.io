<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namma 90's Mittai Box - Online Food Ordering</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🍬 Namma 90's Mittai Box</h1>
                    <p>Traditional Sweets & Foods</p>
                </div>
                <div class="header-right">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search products...">
                        <button class="search-btn">🔍</button>
                    </div>
                    <button class="cart-btn" onclick="toggleCart()">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="main-content">
            <!-- Products Section -->
            <section class="products-section">
                <div class="section-header">
                    <h2>Our Menu</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterProducts('all')">All</button>
                        <button class="filter-btn" onclick="filterProducts('sweets')">Sweets</button>
                        <button class="filter-btn" onclick="filterProducts('savories')">Savories</button>
                        <button class="filter-btn" onclick="filterProducts('beverages')">Beverages</button>
                    </div>
                </div>

                <div class="products-grid" id="productsGrid">
                    <!-- Products will be loaded here by JavaScript -->
                </div>
            </section>
        </div>

        <!-- Cart Sidebar -->
        <aside class="cart-sidebar" id="cartSidebar">
            <div class="cart-header">
                <h2>Your Cart</h2>
                <button class="close-btn" onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="empty-cart">Your cart is empty</p>
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery:</span>
                    <span id="delivery">₹50</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₹0</span>
                </div>
                <button class="checkout-btn" onclick="checkout()">Checkout</button>
                <div class="bottom-margin"></div>
            </div>
        </aside>
    </div>

    <!-- Checkout Modal -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <form class="checkout-form" id="checkoutForm">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Mobile Number *</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" required placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label for="address">Delivery Address *</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="instructions">Special Instructions</label>
                    <textarea id="instructions" rows="2" placeholder="Any special requests?"></textarea>
                </div>
                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div id="orderItems"></div>
                    <div class="summary-row total">
                        <span>Total Amount:</span>
                        <span id="orderTotal">₹0</span>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Complete Order via WhatsApp</button>
                </div>
                <div class="bottom-margin"></div>
            </form>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeModal()"></div>

    <script src="js/app.js"></script>
</body>

</html>
